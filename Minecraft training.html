<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 技能練習 - スキル測定ツール</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #4ade80;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2.5em;
            color: #4ade80;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 0.9em;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: #1a2332;
            border: 2px solid #444;
            color: #a0a0a0;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            transition: all 0.3s;
            border-radius: 0;
        }

        .tab-btn:hover {
            background: #2a3342;
            border-color: #4ade80;
        }

        .tab-btn.active {
            background: #2d5a2d;
            border-color: #4ade80;
            color: #4ade80;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .panel {
            background: #0f1419;
            border: 2px solid #333;
            border-radius: 5px;
            padding: 30px;
            margin-bottom: 20px;
        }

        .panel h2 {
            color: #4ade80;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .setting-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #d0d0d0;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background: #1a2332;
            border: 2px solid #333;
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            border-radius: 3px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #4ade80;
        }

        .key-binding-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .key-binding-item {
            background: #1a2332;
            padding: 15px;
            border: 2px solid #333;
            border-radius: 3px;
        }

        .key-binding-item label {
            margin-bottom: 8px;
        }

        .key-binding-item input {
            margin-bottom: 0;
        }

        .btn {
            padding: 12px 24px;
            background: #4ade80;
            color: #0f1419;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1em;
            border-radius: 3px;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            background: #5fd891;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f97316;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #fb923c;
        }

        .game-area {
            background: #1a2332;
            border: 2px solid #4ade80;
            padding: 30px;
            border-radius: 5px;
            text-align: center;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .game-area h3 {
            color: #4ade80;
            font-size: 2em;
            margin-bottom: 20px;
        }

        .timer {
            font-size: 3em;
            color: #f97316;
            font-weight: bold;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }

        .score-display {
            font-size: 2em;
            color: #4ade80;
            margin: 20px 0;
        }

        .leaderboard {
            display: grid;
            gap: 10px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .leaderboard-entry {
            background: #1a2332;
            padding: 15px;
            border-left: 4px solid #4ade80;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .leaderboard-entry.top {
            border-left-color: #f97316;
        }

        .leaderboard-rank {
            font-weight: bold;
            color: #4ade80;
            font-size: 1.2em;
            min-width: 40px;
        }

        .leaderboard-info {
            flex: 1;
            text-align: left;
            margin-left: 15px;
        }

        .leaderboard-score {
            color: #f97316;
            font-weight: bold;
            font-size: 1.1em;
        }

        .search-box {
            background: #1a2332;
            border: 2px solid #4ade80;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            font-size: 1em;
        }

        .search-engines {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }

        .engine-btn {
            padding: 10px;
            background: #2a3342;
            border: 2px solid #444;
            color: #a0a0a0;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.3s;
        }

        .engine-btn:hover {
            background: #3a4352;
            border-color: #4ade80;
            color: #4ade80;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .stat-box {
            background: #1a2332;
            border: 2px solid #333;
            padding: 20px;
            border-radius: 3px;
            text-align: center;
        }

        .stat-box h4 {
            color: #a0a0a0;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2em;
            color: #4ade80;
            font-weight: bold;
        }

        .sensitivity-slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: #333;
            outline: none;
            -webkit-appearance: none;
        }

        .sensitivity-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4ade80;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }

        .sensitivity-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #4ade80;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }

        .sensitivity-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .sensitivity-value {
            background: #1a2332;
            padding: 15px;
            border: 2px solid #333;
            border-radius: 3px;
            text-align: center;
        }

        .sensitivity-value.active {
            border-color: #4ade80;
            background: #2a3332;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .tabs {
                flex-direction: column;
            }

            .key-binding-grid {
                grid-template-columns: 1fr;
            }

            .timer {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⛏️ Minecraft 技能練習</h1>
            <p class="subtitle">スキル測定＆ランキングシステム</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('keybind')">キーバインド設定</button>
            <button class="tab-btn" onclick="switchTab('speed')">速度測定</button>
            <button class="tab-btn" onclick="switchTab('cps')">連打力測定</button>
            <button class="tab-btn" onclick="switchTab('sensitivity')">感度測定</button>
            <button class="tab-btn" onclick="switchTab('ranking')">ランキング</button>
            <button class="tab-btn" onclick="switchTab('search')">匿名検索</button>
        </div>

        <!-- キーバインド設定 -->
        <div id="keybind" class="tab-content acti
